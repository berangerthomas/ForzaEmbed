[project]
name = "forzaembed"
version = "1.1.0"
description = "A Python framework for text embedding model evaluation and comparison"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "tqdm",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "msgpack",
    "requests",
    "uvicorn",
    "fastapi",
    "beautifulsoup4",
    "markdownify",
    "polars>=1.32.0",
    "nltk>=3.9.1",
    "spacy>=3.8.7",
    "dotenv>=0.9.9",
    "semchunk>=3.2.2",
    "langchain>=0.3.27",
    "langchain-text-splitters>=0.3.0",
    "sqlalchemy>=2.0.0",
    "pip>=25.2",
    "plotly>=6.2.0",
    "kaleido>=1.0.0",
    "pyarrow>=21.0.0",
    "joblib>=1.4.2",
    "jsmin",
    "cssmin",
    "csscompressor>=0.9.5",
    "sentence-transformers>=5.1.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "peft>=0.17.1",
    "torchvision>=0.23.0",
    "fastembed-gpu>=0.7.3",
    "langdetect>=1.0.9",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinx-autodoc-typehints>=3.5.2",
    "umap-learn>=0.5.11",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]
